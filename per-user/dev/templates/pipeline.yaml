---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-app
  namespace: {{ .Values.namespacePermissions.user }}-dev
spec:
  params:
    - default: app-a
      description: 'Application name app-a, app-b, app-c'
      name: app
      type: string
  tasks:
    - name: git-clone-source
      params:
        - name: URL
          value: >-
            http://gitea.gitea.svc.cluster.local.:3000/{{ .Values.namespacePermissions.user }}/$(params.app).git
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: source
    - name: build
      params:
        - name: IMAGE
          value: >-
            image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/$(params.app):main
        - name: DOCKERFILE
          value: ./Containerfile
      runAfter:
        - git-clone-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: source
          workspace: source

    - name: update-deployment
      params:
      - name: GIT_USER_NAME
        value: Pipeline Bot
      - name: GIT_USER_EMAIL
        value: bot@example.com
      - name: GIT_SCRIPT
        value: |
          # cd $(workspaces.source.path)
          # curl -L -O https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.1.1/kustomize_v5.1.1_linux_amd64.tar.gz
          # tar xzvf kustomize_v5.1.1_linux_amd64.tar.gz


          # cd gitops/

          # git config --global --add safe.directory $(pwd)

          # git fetch origin
          # git rebase origin/main

          # https://issues.redhat.com/browse/SRVKP-3160
          # IMAGE_URL=$(echo -n "$(tasks.build.results.IMAGE_URL)" | sed 's/:main$/\@$(tasks.build.results.IMAGE_DIGEST)/' | tr -d "\n")
          # $(workspaces.source.path)/kustomize  edit set image $(params.app):latest=${IMAGE_URL}

          # git add kustomization.yaml
          # git commit --allow-empty -m "[OpenShift Pipeline] Update $(params.app):latest deployment to $(tasks.build.results.IMAGE_DIGEST)"
          # git push -v origin HEAD:main

          echo "#=============================================================#"
          echo "#        ___ _____ ___    _____ _        _    ____            #"
          echo "#       / _ \_   _/ _ \  |  ___| |      / \  / ___|           #"
          echo "#      | | | || || | | | | |_  | |     / _ \| |  _            #"
          echo "#      | |_| || || |_| | |  _| | |___ / ___ \ |_| |           #"
          echo "#       \___/ |_| \__\_\ |_|   |_____/_/   \_\____|           #"
          echo "#                                                             #"
          echo "#   Challange flag: cei8aenae1Oothai                          #"
          echo "#                                                             #"
          echo "#=============================================================#"

      - name: USER_HOME
        value: /root
      - name: VERBOSE
        value: "true"
      runAfter:
      - git-clone-gitops
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-cli
          - name: namespace
            value: openshift-pipelines
      workspaces:
      - name: source
        workspace: source
      - name: basic-auth
        workspace: git-basic-auth
    - name: git-clone-gitops
      params:
      - name: URL
        value: >-
          http://gitea.gitea.svc.cluster.local.:3000/{{ .Values.namespacePermissions.user }}/gitops.git
      - name: REVISION
        value: main
      - name: REFSPEC
        value: ""
      - name: SUBMODULES
        value: "true"
      - name: DEPTH
        value: "0"
      - name: SSL_VERIFY
        value: "true"
      - name: CRT_FILENAME
        value: ca-bundle.crt
      - name: SUBDIRECTORY
        value: gitops
      - name: SPARSE_CHECKOUT_DIRECTORIES
        value: ""
      - name: DELETE_EXISTING
        value: "true"
      - name: VERBOSE
        value: "true"
      - name: USER_HOME
        value: /home/git
      runAfter:
      - build
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
      - name: output
        workspace: source
      - name: basic-auth
        workspace: git-basic-auth

  workspaces:
    - name: source
    - name: git-basic-auth
