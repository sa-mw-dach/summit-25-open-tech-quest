apiVersion: v1
kind: ConfigMap
metadata:
  name: resolutionrequests-cleaner-playbook
data:
  play.yaml: |-
    #!/usr/bin/env ansible-playbook
    ---
    - hosts: localhost
      gather_facts: false
      tasks:

        - kubernetes.core.k8s_info:
            api_version: route.openshift.io/v1
            kind: Route
            name: gitea
            namespace: gitea
          register: gitea

        - name: Create consolelinks
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: console.openshift.io/v1
              kind: ConsoleLink
              metadata:
                name: gitea
              spec:
                applicationMenu:
                  imageURL: data:image/png;base64,
                  section: Git
                href: "https://{{gitea.resources[0].spec.host}}"
                location: ApplicationMenu
                text: Gitea
      